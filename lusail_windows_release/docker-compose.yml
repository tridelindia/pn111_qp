services:
  # ========================================================
  # 1. DATABASE SERVICE (PostgreSQL with pre-populated db_lusail)
  # ========================================================
  database:
    image: lusail-database:latest
    container_name: lusail_database
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-db_lusail}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Tridel@qp@2025}
    ports:
      - "${HOST_DB_PORT:-5434}:5432"
    volumes:
      - lusail_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-db_lusail}"]
      interval: 4s
      timeout: 5s
      retries: 25
      start_period: 10s
    networks:
      - lusail_network

  # ========================================================
  # 2. BACKEND SERVICE (Node.js REST API + WebSocket)
  # ========================================================
  backend:
    image: lusail-backend:latest
    container_name: lusail_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-db_lusail}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-Tridel@qp@2025}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/getStationConfig || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - lusail_network

  # ========================================================
  # 3. FRONTEND SERVICE (Angular SPA + Nginx)
  # ========================================================
  frontend:
    image: lusail-frontend:latest
    container_name: lusail_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - lusail_network

volumes:
  lusail_db_data:
    name: lusail_db_data

networks:
  lusail_network:
    name: lusail_network
    driver: bridge
