<div class="log-container" style="height: 75vh;">
    <div class="sidebar">
      <div class="calendar-container">
        <p-calendar [(ngModel)]="dateRange" selectionMode="range" [inline]="true" 
                    [readonlyInput]="true" dateFormat="dd/mm/yy"
                    styleClass="custom-calendar">
        </p-calendar>
        <div class="update-btn-container" style="margin-top: 165px;">
          <p-button label="Update" (click)="filterByDateRange()" 
            icon="pi pi-refresh" iconPos="bottom" >
          </p-button>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="header">
        <div class="title-section">
          <h1>Activity Log</h1>
          <p class="subtitle">Track and monitor user activities</p>
        </div>
        <div class="controls">
          <p-button icon="pi pi-refresh" (onClick)="loadLogs()" 
                    styleClass="p-button-rounded p-button-text p-button-secondary"></p-button>
          <span class="p-input-icon-left">
            <i class="pi pi-search"></i>
            <input type="text" pInputText [(ngModel)]="searchTerm" 
                   (input)="filterLogs()" placeholder="Search logs..." />
          </span>
        </div>
      </div>
    
      <div *ngIf="isLoading" class="loading">
        <p-progressSpinner strokeWidth="4"></p-progressSpinner>
        <p>Loading logs...</p>
      </div>
    
      <p-message *ngIf="error" severity="error" (onClose)="error = null">
        {{ error }}
        <button pButton label="Retry" (click)="loadLogs()" class="p-button-text p-button-sm"></button>
      </p-message>
    
      <div *ngIf="!isLoading && !error" class="log-list">
        <p-card *ngIf="filteredLogs.length === 0" class="no-logs">
          <div class="empty-state">
            <i class="pi pi-inbox"></i>
            <h3>No logs found</h3>
            <p>No activity logs match your search criteria</p>
          </div>
        </p-card>
    
        <div class="table-container" *ngIf="filteredLogs.length > 0">
          <table>
            <thead>
              <tr>
                <th class="col-number">#</th>
                <th class="col-timestamp">Timestamp</th>
                <th class="col-user">User</th>
                <th class="col-activity">Activity</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let log of filteredLogs; let i = index">
                <td class="col-number">
                  <span>{{ i + 1 }}</span>
                </td>
                <td class="col-timestamp">
                  <i class="pi pi-clock"></i>
                  <span> {{ formatDate(log.timestamp) }}</span>
                </td>
                <td class="col-user">
                  <i class="pi pi-user"></i>
                  <span> {{ log.userName }} - {{ log.userId }}</span>
                </td>
                <td class="col-activity">
                  <i class="pi pi-file"></i>
                  <span> {{ log.activity }}</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<style>
.log-container {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  width: 300px;
  padding: 20px;
  background-color: #f8f9fa;
  border-right: 1px solid #dee2e6;
}

.calendar-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.update-btn-container {
  display: flex;
  justify-content: center;
  margin-top: 10px;
}

.custom-calendar {
  width: 100%;
  border: 1px solid #dee2e6;
  border-radius: 4px;
  padding: 10px;
  background-color: white;
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.log-list {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.table-container {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid #dee2e6;
}

th {
  background-color: #f8f9fa;
  font-weight: 600;
}

/* Custom scrollbar styles */
.log-list::-webkit-scrollbar {
  width: 8px;
}

.log-list::-webkit-scrollbar-track {
  background: #f1f1f1;
}

.log-list::-webkit-scrollbar-thumb {
  background: #888;
  border-radius: 4px;
}

.log-list::-webkit-scrollbar-thumb:hover {
  background: #555;
}
</style>
