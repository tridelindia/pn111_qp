<div class="sensors_main">
    <div class="sensor_left_section">
        <div class="sensors">
            <div class="ocean" [ngClass]="selectedSensor === 'ocean'? 'ocean_selected' : 'ocean'"
                (click)="onSensorSelect('ocean')">
                <p>

                    Oceanography
                </p>
            </div>
            <div class="ocean" [ngClass]="selectedSensor === 'met'? 'ocean_selected' : 'ocean'"
                (click)="onSensorSelect('met')">
                <p>Meteriology</p>
            </div>
            <div class="ocean" [ngClass]="selectedSensor === 'wat'? 'ocean_selected' : 'ocean'"
                (click)="onSensorSelect('wat')">
                <p>Water Quality</p>
            </div>
            <div class="ocean" [ngClass]="selectedSensor === 'mic'? 'ocean_selected' : 'ocean'"
                (click)="onSensorSelect('mic')">
                <p>MicroFLu</p>
            </div>
        </div>
        <div class="sensor_table_container">
            <div class="sensor_table_header">
                <table>
                    <thead>
                        <tr>
                            <!-- <th>Id</th> -->
                            <!-- <th>Sensor</th> -->
                            <th>Name</th>
                            <th>Unit</th>
                            <th>Minimum</th>
                            <th>Maximum</th>
                            <!-- <th>Notification</th> -->
                            <th>Action</th>
                        </tr>
                    </thead>
                </table>
            </div>
            <div class="sensor_table_body">
                <table>
                    <tbody>
                        <tr *ngFor="let item of tableData; let i = index">
                            <!-- <td>{{ i + 1 }}</td> -->
                            <!-- <td>{{ item.sensor }}</td> -->
                            <td *ngIf="item.param_name !== 'wave_heading'">
                                {{ item?.param_name }}

                            </td>
                            <td *ngIf="item.param_name !== 'wave_heading'">{{ item!.unit }}</td>
                            <td *ngIf="item.param_name !== 'wave_heading'">{{ item!.warning !== null ? item!.warning :
                                '—' }}</td>
                            <td *ngIf="item.param_name !== 'wave_heading'">{{ item!.danger !== null ? item!.danger : '—'
                                }}</td>
                            <!-- <td *ngIf="item.param_name !== 'wave_heading'">
                                <span class="badge" [ngClass]="{
                    'bg-success': item!.notification === 'enabled',
                    'bg-secondary': item!.notification === 'disabled'
                  }">
                                    {{ item!.notification }}
                                </span>
                            </td> -->
                            <td *ngIf="item.param_name !== 'wave_heading'"><i class="fa fa-edit"
                                    style="color: rgb(109, 109, 245);" (click)="onEdit(item)"></i>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="sensor_right_section">
        <!-- Right section content -->

        <h4>Edit Parameter</h4>

        <p style="font-weight: 500;">{{editData.param_name}}</p>
        <!-- <input type="text" placeholder="Enter name"> -->

        <p>Unit</p>
        <input *ngIf="!isMulti" type="text" placeholder="Enter unit" [(ngModel)]="editData.unit">

        <div class="multi" *ngIf="isMulti">
            <div class="item" [ngClass]="selectedUnit === i ? 'item_active':'item'" *ngFor="let i of multiData"
                (click)="onUnitSelect(i)">
                <p>{{i}}</p>
            </div>
        </div>
        <p>Minimum</p>
        <input type="text" placeholder="Enter Minimum" [(ngModel)]="editData.warning">
        <p>Maximum</p>
        <input type="text" placeholder="Enter Maximum" [(ngModel)]="editData.danger">
        <!-- <p>Notification</p>
        <div class="toggle_pint">
            <p></p>
            <div class="toggle" [ngClass]="{'toggledms': mainToggle}"
                [ngStyle]="{'background-color': mainToggle ? 'blue' : 'rgb(224, 223, 223)'}" (click)="toggle()">
                <div class="t_button"></div>
            </div>
            <p style="margin-left: -5px;">{{mainToggle ? 'Enabled':'Disabled'}}</p>
        </div> -->
        <div class="but">

            <button (click)="Update()">Update</button>
        </div>
    </div>
</div>
