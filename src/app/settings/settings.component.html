    <!-- <h2>Settings</h2> -->
    <div class="head">
        <!-- <div [ngClass]="activeOption ===0 ? 'option_active': 'option'" (click)="changeOption(0)">
            <h5>General</h5>
        </div> -->
        <div [ngClass]="activeOption ===1 ? 'option_active': 'option'" (click)="changeOption(1)">
            <h5>Staion Setting</h5>
        </div>
        <div [ngClass]="activeOption ===2 ? 'option_active': 'option'" (click)="changeOption(2)">
            <h5>Sensor Setting</h5>
        </div>
        <div [ngClass]="activeOption ===3 ? 'option_active': 'option'" (click)="changeOption(3)">
            <h5>Appearace</h5>
        </div>
        <div [ngClass]="activeOption ===4 ? 'option_active': 'option'" (click)="changeOption(4)">
            <h5>Billing</h5>
        </div>
        <div [ngClass]="activeOption ===5 ? 'option_active': 'option'" (click)="changeOption(5)">
            <h5>Notifications</h5>
        </div>

    </div>

    <div class="boddy">
        @if (activeOption === 0) {
        <app-general></app-general>
        }
        @else if(activeOption == 1){
        <app-station></app-station>
        }@else if(activeOption == 2){

        <app-sensor></app-sensor>
        }@else if (activeOption ===3) {
        <app-appearance style="width: 100%;"></app-appearance>
        }@else if (activeOption ===5) {
        <app-notification style="width: 100%;"></app-notification>
        }
    </div>
</div>
