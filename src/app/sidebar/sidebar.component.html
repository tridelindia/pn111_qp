<div class="sidebar">
    <div class="navigators">
        <a *ngIf="permissions['Home']?.includes('read')" routerLink="/base/home" title="Home">
            <i class="fa-solid fa-house" [ngClass]="{'selected': selectedIndex === 0}"></i>
        </a>
        <a *ngIf="permissions['Dashboard']?.includes('read')" routerLink="/base/dashboard" title="Dashboard">
            <i class="fa-solid fa-square-poll-vertical" [ngClass]="{'selected': selectedIndex === 1}"></i>
        </a>
        <a *ngIf="permissions['Analysis']?.includes('read') || permissions['Analytics']?.includes('read')" routerLink="/base/analytics" title="Analytics">
            <i class="fa-solid fa-chart-line" [ngClass]="{'selected': selectedIndex === 2}"></i>
        </a>
        <a *ngIf="permissions['Reports']?.includes('read')" routerLink="/base/reports" title="Reports">
            <i class="fa-regular fa-rectangle-list" [ngClass]="{'selected': selectedIndex === 3}"></i>
        </a>
        <a *ngIf="permissions['User Management']?.includes('read')" routerLink="/base/users" title="User Management">
            <i class="fa-solid fa-users-cog" [ngClass]="{'selected': selectedIndex === 4}"></i>
        </a>
        <a *ngIf="permissions['Settings']?.includes('read')" routerLink="/base/settings" title="Settings">
            <i class="fa-solid fa-gears" [ngClass]="{'selected': selectedIndex === 5}"></i>
        </a>
        <a *ngIf="permissions['Sensor Health']?.includes('read')" routerLink="/base/data-health" title="Data Health">
            <i class="fa-solid fa-heart-pulse" [ngClass]="{'selected': selectedIndex === 7}"></i>
        </a>
        <a *ngIf="permissions['Notification']?.includes('read')" routerLink="/base/notification" title="Notification Management">
            <i class="fa-solid fa-envelope" [ngClass]="{'selected': selectedIndex === 8}"></i>
        </a>
        <a (click)="logout()" title="Logout" style="cursor: pointer;">
            <i class="fa-solid fa-right-from-bracket" [ngClass]="{'selected': selectedIndex === 6}"></i>
        </a>
    </div>
</div>
