<div class="report-container">
    <div class="topcontent">
        <!-- <h1>Reports</h1> -->
        <h1>{{ selectedBuoy.station_name}}</h1>
    </div>


    <div class="tablecontainer">
        <p-table #dt [value]="sensorData" [columns]="selectedColumns" [loading]="loading" paginator="true" [rows]="10"
            [rowsPerPageOptions]="[10,15,20]" [scrollable]="true" [resizableColumns]="true" columnResizeMode="expand"
            [globalFilterFields]="globalFilterFields" [exportHeader]="'exportHeader'" selectionMode="multiple"
            [(selection)]="selectedColumns"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [filterDelay]="0"
            [tableStyle]="{'min-width': '50rem'}" responsiveLayout="stack" [breakpoint]="'960px'" stripedRows
            rowHover="true" showCurrentPageReport="true">

            <ng-template #caption>
                <div class="caption">
                    <div class="captionrow">
                        <div id="search">
                            <input type="search" placeholder="Search"
                                (input)="onSearch($any($event).target.value, dt)" />
                        </div>

                        <div class="pselect">
                            <p-selectButton [options]="options" [(ngModel)]="selectedOption"
                                (onChange)="onOptionChange()">
                            </p-selectButton>
                        </div>
                    </div>

                    <div class="captionrow">
                        <div class="date-range-selector">
                            <p-selectButton [options]="periodOptions" [(ngModel)]="selectedPeriod"
                                (onChange)="setView(selectedPeriod)">
                            </p-selectButton>
                        </div>

                        <div class="filter">
                            <p-multiselect display="chip" [options]="dynaColumns" optionLabel="header"
                                [(ngModel)]="selectedColumns" placeholder="Select Columns" [maxSelectedLabels]="7"
                                styleClass="w-full md:w-80" showHeader="false" selectedItemsLabel="{0} columns selected"
                                [filter]="true" />
                        </div>
                    </div>

                    <div class="captionrow">

                        <div class="date-picker" *ngIf="selectedPeriod === 'date'">
                            <p-datepicker [(ngModel)]="rangeDates" selectionMode="range" [showIcon]="true"
                                (onSelect)="setView('date')"
                                [ngClass]="{ 'custom-date-input': selectedPeriod === 'date' }">
                            </p-datepicker>
                        </div>
                        <!-- Weekly -->
                        <div class="date-picker" *ngIf="selectedPeriod === 'week'">
                            <!-- <label>Select Week:</label> -->
                            <p-datepicker [(ngModel)]="selectedDate" [showIcon]="true"
                                (onSelect)="setView('week')"></p-datepicker>
                        </div>
                        <!-- Monthly -->
                        <div class="date-picker" *ngIf="selectedPeriod === 'month'">
                            <!-- <label>Select Month:</label> -->
                            <p-datepicker [(ngModel)]="selectedDate" view="month" dateFormat="MM yy" [showIcon]="true"
                                (onSelect)="setView('month')">
                            </p-datepicker>
                        </div>
                        <!-- Yearly -->
                        <div class="date-picker" *ngIf="selectedPeriod === 'year'">
                            <!-- <label>Select Year:</label> -->
                            <p-datepicker [(ngModel)]="selectedDate" view="year" dateFormat="yy" [showIcon]="true"
                                (onSelect)="setView('year')">
                            </p-datepicker>
                        </div>


                        <div class="importExport">

                            <p-select [options]="fetchedBuoys" [(ngModel)]="selectedBuoy" optionLabel="station_name"
                                placeholder="Select a City" class="w-full md:w-56" (onChange)="fetchDataByDate2()" />

                            <p-select class="export" [options]="exportOptions" placeholder="Export"
                                (onChange)="onExportOptionSelect($event, dt)">
                                <ng-template let-option pTemplate="selectedItem">
                                    <span>{{ option.label }}</span>
                                </ng-template>
                            </p-select>
                        </div>

                    </div>
                </div>
            </ng-template>

            <ng-template #header let-columns>
                <tr>
                    <th pSortableColumn="id" class="centered-cell">
                        ID <p-sortIcon field="id"></p-sortIcon>
                    </th>
                    <th pSortableColumn="station_id" class="centered-cell">
                        Station ID <p-sortIcon field="station_id"></p-sortIcon>
                    </th>
                    <th pSortableColumn="timestamp" class="centered-cell">
                        Timestamp <p-sortIcon field="timestamp"></p-sortIcon>
                    </th>
                    <th pSortableColumn="datetime" class="centered-cell">
                        DateTime <p-sortIcon field="datetime"></p-sortIcon>
                    </th>
                    <th pSortableColumn="battery" class="centered-cell">
                        Battery <p-sortIcon field="battery"></p-sortIcon>
                    </th>
                    <th pSortableColumn="lat" class="centered-cell">
                        Latitude <p-sortIcon field="lat"></p-sortIcon>
                    </th>
                    <th pSortableColumn="lon" class="centered-cell">
                        Longitude <p-sortIcon field="lon"></p-sortIcon>
                    </th>
                    <th *ngFor="let col of columns" [pSortableColumn]="col.field" class="centered-cell">
                        <!-- <div style="display: flex; flex-direction: column; align-items: center;"> -->
                        <span>{{ col.header }} <p-sortIcon [field]="col.field"></p-sortIcon></span>
                        <!-- <small *ngIf="col.unit" class="text-gray-500">{{ col.unit }}</small>
                        </div> -->
                    </th>
                </tr>
            </ng-template>

            <ng-template #body let-rowData let-columns="columns">
                <!-- <tr> -->
                <tr [ngClass]="{ 'highlight-row': rowMatchesSearch(rowData, columns) }">
                    <!-- Static Columns -->
                    <td class="centered-cell">
                        <span [innerHTML]="highlightSearchText(rowData['id'])"></span>
                    </td>
                    <td class="centered-cell">
                        <span [innerHTML]="highlightSearchText((rowData['station_id']))"></span>
                    </td>
                    <td class="centered-cell">
                        <span [innerHTML]="highlightSearchText((rowData['timestamp']))"></span>
                    </td>
                    <td class="centered-cell">
                        <span [innerHTML]="highlightSearchText((rowData['datetime']))"></span>
                    </td>
                    <td class="centered-cell">
                        <span [innerHTML]="highlightSearchText((rowData['battery']))"></span>
                    </td>
                    <td class="centered-cell">
                        <span [innerHTML]="highlightSearchText((rowData['lat']))"></span>
                    </td>
                    <td class="centered-cell">
                        <span [innerHTML]="highlightSearchText((rowData['lon']))"></span>
                    </td>
                    <td *ngFor="let col of columns" class="centered-cell">
                        <span [innerHTML]="col.field === 'timestamp' || col.field === 'datatim'
                        ? highlightSearchText((rowData[col.field]))
                        : highlightSearchText(rowData[col.field])"></span>
                    </td>
                </tr>
            </ng-template>

        </p-table>
    </div>

    <div class="quickviewContainer">
        <div class="exportview">
            <h3>Daily</h3>
            <div class="exportviewico"><i class="fas fa-calendar-check"></i></div>
            <p>Export Daily Senosr data</p>
            <button class="export-btn" (click)="quickExportByRange(dt, 'Daily')">
                <i class="fas fa-file-download"></i> Quick Export
            </button>
        </div>
        <div class="exportview">
            <h3>Monthly</h3>
            <div class="exportviewico"><i class="fas fa-calendar-check"></i></div>
            <p>Export Monthly Senosor Data</p>
            <button class="export-btn" (click)="quickExportByRange(dt, 'Monthly')">
                <i class="fas fa-file-download"></i> Quick Export
            </button>
        </div>
        <div class="exportview">
            <h3>Yearly</h3>
            <div class="exportviewico"><i class="fas fa-calendar-check"></i></div>
            <p>Export Yearly Sensor Data</p>
            <button class="export-btn" (click)="quickExportByRange(dt, 'Yearly')">
                <i class="fas fa-file-download"></i> Quick Export
            </button>
        </div>
    </div>

</div>
